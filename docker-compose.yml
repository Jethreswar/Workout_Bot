version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: workout-tracker-mongo-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: workout_tracker
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - workout-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workout-tracker-backend-dev
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://root:password@mongodb:27017/workout_tracker?authSource=admin
      PORT: 4000
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - workout-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workout-tracker-frontend-dev
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://localhost:4000/api
    depends_on:
      - backend
    networks:
      - workout-network

volumes:
  mongodb_data:

networks:
  workout-network:
    driver: bridge
