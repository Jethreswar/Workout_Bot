version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: workout-tracker-mongo-prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: workout_tracker_production
    volumes:
      - mongodb_prod_data:/data/db
      - ./backups:/backups
    networks:
      - workout-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${DOCKER_REGISTRY}/workout-tracker-backend:${IMAGE_TAG:-latest}
    container_name: workout-tracker-backend-prod
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/workout_tracker_production?authSource=admin
      PORT: 4000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - mongodb
    networks:
      - workout-network
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${DOCKER_REGISTRY}/workout-tracker-frontend:${IMAGE_TAG:-latest}
    container_name: workout-tracker-frontend-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      REACT_APP_API_URL: https://api.yourdomain.com/api
    depends_on:
      - backend
    networks:
      - workout-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx reverse proxy for production
  nginx-proxy:
    image: nginx:alpine
    container_name: workout-tracker-nginx-prod
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - workout-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongodb_prod_data:

networks:
  workout-network:
    driver: bridge
